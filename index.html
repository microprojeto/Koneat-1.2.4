<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>Koneat</title>
<style>
:root{--nav:#111214;--nav-h:68px;--muted:#8e8e93;--selected:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:#fff;color:#000;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
button,input,select{font:inherit}
button{cursor:pointer}
.screen{display:none;min-height:calc(100dvh - var(--nav-h) - env(safe-area-inset-bottom))}
.screen.active{display:block}
#screen-home,#screen-perfil,#screen-config{background:#fff;color:#000}
#screen-config{padding-bottom:24px}
body.settings-open{padding-bottom:0}
body.settings-open .bottom{display:none}
.profile-menu-wrap{position:relative}
.profile-menu{position:absolute;right:0;top:39px;width:194px;background:#fff;border-radius:17px;padding:6px 0;box-shadow:0 8px 26px rgba(0,0,0,.12);z-index:120;display:none}
.profile-menu.open{display:block}
.profile-menu button{width:100%;height:48px;border:0;background:#fff;color:#292929;display:flex;align-items:center;gap:12px;padding:0 16px;text-align:left;font-size:15px;font-weight:500}
.profile-menu button:active{background:#f5f5f5}
.profile-menu svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
.settings-header{height:76px;display:flex;align-items:center;gap:16px;padding:0 22px;border-bottom:1px solid #f0f0f0}
.settings-header h1{font-size:27px;letter-spacing:-.8px;margin:0;font-weight:850;flex:1}
.settings-back,.settings-gear{border:0;background:transparent;color:#202124;display:grid;place-items:center;width:42px;height:42px}
.settings-back svg{width:25px;height:25px}.settings-gear svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.settings-list{padding:22px 18px 26px;display:flex;flex-direction:column;gap:12px}
.settings-row{min-height:82px;border:0;border-radius:17px;background:#fff;box-shadow:0 5px 18px rgba(0,0,0,.075);display:flex;align-items:center;gap:14px;padding:13px 15px;text-align:left;color:#111;width:100%}
.settings-row .setting-icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;background:#4269a9}
.settings-row .setting-icon svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.settings-copy{min-width:0;flex:1}.settings-copy strong{display:block;font-size:17px;font-weight:750;line-height:1.2}.settings-copy small{display:block;color:#777;font-size:13px;margin-top:4px}
.settings-chevron{width:20px;height:20px;color:#999;flex:none}
.settings-switch{width:46px;height:27px;border-radius:20px;background:#d5d5d5;padding:3px;flex:none;transition:.2s}.settings-switch:after{content:"";display:block;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:.2s}.settings-switch.on{background:#287be8}.settings-switch.on:after{transform:translateX(19px)}
.settings-row.danger .settings-copy strong{color:#d34b52}
.settings-save{display:block;margin:0 auto 8px;border:0;border-radius:22px;background:#2478e8;color:#fff;font-weight:700;padding:11px 20px;font-size:15px}

#screen-reels,#screen-criar,#screen-perfil-criar{background:#000;color:#fff}
.app-header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 28px;background:#fff;border-bottom:1px solid #eee}
.app-header h1{margin:0;font-size:25px;font-weight:850;letter-spacing:-1px}
.home-header-actions{display:flex;align-items:center;gap:20px}
.icon-btn{width:40px;height:40px;border:0;background:transparent;color:inherit;display:grid;place-items:center;padding:0}
.icon-btn svg{width:27px;height:27px}
.home-tabs{height:62px;display:flex;align-items:stretch;gap:28px;padding:0 28px;border-bottom:1px solid #eee;overflow-x:auto;scrollbar-width:none}
.home-tabs::-webkit-scrollbar{display:none}
.home-tab{position:relative;flex:0 0 auto;border:0;background:none;color:#96969b;font-size:17px;font-weight:500;padding:0 0 2px}
.home-tab.active{color:#111;font-weight:750}
.home-tab.active:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:#111}
.stories{height:142px;display:flex;align-items:flex-start;gap:16px;padding:20px 26px 14px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #eee}
.stories::-webkit-scrollbar{display:none}
.story{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:inherit;padding:0;position:relative}
.story-avatar{width:80px;height:80px;border-radius:50%;background:#e9e9ed;border:1.8px solid #111;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#929297}
.story-avatar.has-story{border:2px solid #d62976}
.story-avatar img,.story-avatar video{width:100%;height:100%;object-fit:cover}
.story-avatar svg{display:none}
.story-plus{position:absolute;right:0;bottom:0;top:auto;width:27px;height:27px;border-radius:50%;background:#050505;color:#fff;border:2px solid #fff;display:grid;place-items:center;z-index:2}
.story-plus svg{width:16px;height:16px}
.story-name{font-size:14px;color:#222;margin-top:1px}
.empty{text-align:center;padding:60px 20px;color:#8e8e93;font-size:14px;line-height:1.5}
.post{border-bottom:1px solid #eee;margin-bottom:12px}
.post-head{height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 16px}
.post-media{width:100%;aspect-ratio:4/5;background:#080808;display:flex;align-items:center;justify-content:center;overflow:hidden}
.post-media img,.post-media video{width:100%;height:100%;object-fit:cover}
.post-actions{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
.post-actions button{width:36px;height:34px;border:0;background:none;color:inherit;padding:5px}
.post-actions svg{width:24px;height:24px}
.post-caption{padding:0 16px 12px;font-size:14px}
#screen-reels{position:relative}
#screen-reels.active{display:flex;flex-direction:column}
#reelsFeed{flex:1;display:flex;flex-direction:column;min-height:0}
#reelsFeed>.empty{flex:1;display:flex;align-items:center;justify-content:center;width:100%;padding:20px;margin:0}
.reels-header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#000;color:#fff}
.reels-header h2{font-size:22px;margin:0;font-weight:750}
.reels-actions{display:flex;gap:14px}
#reelsFeed .post{border:0;margin:0}
#reelsFeed .post-head{background:#000;color:#fff}
#reelsFeed .post-actions{color:#fff}
#reelsFeed .empty{color:#929297;font-size:17px}
#screen-criar{min-height:calc(100dvh - var(--nav-h) - env(safe-area-inset-bottom));padding-bottom:12px}
body.profile-create-open{padding-bottom:0}
body.profile-create-open .bottom{display:none}
body.profile-create-open #screen-perfil-criar{display:block;position:fixed;inset:0;z-index:150;width:100%;height:100dvh;min-height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);overflow-y:auto}
body.profile-create-open #screen-criar{display:none}
body.profile-create-open .create-layout{min-height:calc(100dvh - 96px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.profile-advance{display:none;border:1px solid #fff;border-radius:12px;background:#000;color:#fff;font-size:16px;font-weight:700;padding:9px 17px;min-width:0;white-space:nowrap}
body.profile-create-open .profile-advance{display:block}
body.profile-create-open .create-tool-actions{display:none}
body.profile-create-open .create-bottom{display:none}

.nav-advance-corner,.profile-advance-corner{border:1px solid #fff;border-radius:22px;background:#000;color:#fff;font-size:15px;font-weight:750;padding:8px 15px;white-space:nowrap}
.profile-advance-corner{display:none}
body.profile-create-open .profile-advance-corner{display:block}
body.profile-create-open #screen-perfil-criar .create-tool-actions{display:none}
body.profile-create-open #screen-perfil-criar .create-bottom{display:none}
body.profile-create-open #screen-perfil-criar .profile-advance{display:none}

.create-top{height:96px;border-bottom:1px solid rgba(255,255,255,.17);display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;padding:0 24px 0 28px;gap:8px}
.create-close{width:38px;height:44px;border:0;background:none;color:#fff;display:grid;place-items:center}
.create-close svg{width:30px;height:30px}
.create-layout-mode{width:44px;height:44px;border:0;background:none;color:#fff;display:grid;place-items:center;padding:0}
.create-layout-mode svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round}
.create-tabs{height:100%;width:100%;display:flex;align-items:center;justify-content:space-evenly;gap:clamp(8px,3vw,24px)}
.create-tab{height:100%;position:relative;display:flex;align-items:center;justify-content:center;border:0;background:none;color:#777;font-size:clamp(18px,5vw,24px);font-weight:800;padding:0 2px;white-space:nowrap}
.create-tab.active{color:#fff}
.create-tab.active:after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:#fff;border-radius:3px}
.create-layout{min-height:calc(100dvh - 96px - var(--nav-h) - env(safe-area-inset-bottom));display:flex;flex-direction:column}
.create-tools{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.gallery-select{border:0;background:none;color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;gap:9px;padding:8px 0}
.gallery-select svg{width:17px;height:17px}
.create-tool-actions{display:flex;gap:12px}
.round-tool{width:54px;height:54px;border:0;border-radius:50%;background:#191a1d;color:#fff;display:grid;place-items:center}
.round-tool svg{width:27px;height:27px}
.create-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center;color:#d4dce7}
.create-empty svg{width:48px;height:48px;stroke:#929297;stroke-width:3}
.create-empty p{margin:0;font-size:17px;color:#929297}
.create-empty .koneat-mark{font-size:34px;line-height:1;font-weight:900;letter-spacing:-3px;color:#77787d}
.create-empty .koneat-mark span{font-size:.52em;letter-spacing:-1px}
.create-empty.nav-create-empty{gap:16px}
.create-empty.nav-create-empty p{font-size:17px;font-weight:700}
.create-bottom{padding:0 18px 12px}
.create-divider{height:1px;background:rgba(255,255,255,.22);width:100%;margin-bottom:20px}
.advance-button{display:block;margin:0 auto;border:1px solid #fff;border-radius:12px;background:#000;color:#fff;font-size:16px;font-weight:700;padding:9px 17px;min-width:0;white-space:nowrap}
.hidden-file{display:none}
.profile-top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 28px;background:#fff}
.profile-top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.65px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-top-actions{display:flex;align-items:center;gap:14px}
.profile-top-actions .icon-btn{width:32px;height:40px}
.profile-top-actions svg{width:25px;height:25px}
.profile-summary{display:grid;grid-template-columns: minmax(112px, .95fr) 2.05fr;align-items:center;padding:22px 20px 24px;gap:18px}
.profile-avatar-wrap{position:relative;width:clamp(104px,23vw,132px);height:clamp(104px,23vw,132px)}
.perfil-avatar{width:100%;height:100%;border-radius:50%;background:#f1f3f5;color:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}
.perfil-avatar svg{width:100%;height:100%;display:block}
.profile-camera{position:absolute;right:0;bottom:0;width:34px;height:34px;border-radius:50%;background:#050505;color:#fff;border:2px solid #fff;display:grid;place-items:center}
.profile-camera svg{width:19px;height:19px}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:4px}
.profile-stat strong{display:block;font-size:21px;line-height:1.35;font-weight:750}
.profile-stat span{display:block;font-size:14px;line-height:1.35;white-space:nowrap}
.profile-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 22px}
.profile-actions button{height:48px;border:0;border-radius:13px;background:#efeff0;color:#111;font-size:15px;font-weight:700}
.profile-tabs{height:70px;display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #eee}
.profile-tab{position:relative;border:0;background:#fff;color:#96969b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:13px}
.profile-tab svg{width:25px;height:25px}
.profile-tab.active{color:#111;font-weight:700}
.profile-tab.active:after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:#111}
.perfil-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.perfil-grid img,.perfil-grid video{width:100%;aspect-ratio:1;object-fit:cover;background:#eee}
.profile-empty{min-height:calc(100dvh - 58px - 178px - 70px - var(--nav-h));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 18px;color:#96969b}
.profile-empty svg{width:44px;height:44px;margin-bottom:18px}
.profile-empty p{margin:0 0 14px;font-size:16px}
.profile-empty button{border:0;border-radius:13px;background:#efeff0;color:#111;font-size:15px;font-weight:700;padding:14px 22px}
@media(max-width:360px){.profile-summary{padding-left:16px;padding-right:16px;gap:10px}.profile-stat span{font-size:12px}.profile-top h1{font-size:19px}}
.bottom{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);margin:0;background:#fff;border-top:1px solid #ededed;border-radius:0;display:flex;justify-content:space-around;align-items:center;z-index:99;transition:background .18s ease}
.bottom button{width:58px;height:48px;border:0;border-radius:999px;background:transparent;color:#111;display:grid;place-items:center;padding:0;transition:background .16s ease,width .16s ease,height .16s ease,color .16s ease}
.bottom button svg{width:30px;height:30px;display:block;overflow:visible}
.bottom button.active{width:102px;height:56px;background:#eeeeef}
.bottom button .profile-nav-icon{width:30px;height:30px;overflow:visible}
.profile-nav-ring{fill:none;stroke:currentColor;stroke-width:2.15}
.profile-nav-person{fill:none;stroke:currentColor;stroke-width:2.05;stroke-linecap:round;stroke-linejoin:round}
/* As telas escuras mantêm a barra preta e o destaque fumê */
body.nav-dark .bottom{background:#111214;border-top-color:#202124}
body.nav-dark .bottom button{color:#fff}
body.nav-dark .bottom button.active{background:#343538}
body.nav-dark .bottom button .profile-nav-icon{width:30px;height:30px}
body.nav-dark .bottom button[data-go="perfil"] .profile-nav-ring,
body.nav-dark .bottom button[data-go="perfil"] .profile-nav-person{fill:none;stroke:#fff}
body.nav-light .bottom{background:#fff;border-top-color:#ededed}
body.nav-light .bottom button{color:#111}
body.nav-light .bottom button.active{background:#eeeeef}
body.nav-light .bottom button[data-go="home"].active svg .filled{fill:#111}

.bottom button:focus-visible,.icon-btn:focus-visible,.create-tab:focus-visible{outline:2px solid #fff;outline-offset:3px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px);transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:20px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:200;white-space:nowrap}
.toast.show{opacity:1}
@media(min-width:700px){main{max-width:520px;margin:0 auto}.bottom{max-width:520px;left:50%;transform:translateX(-50%)}}

.settings-subpage{padding:22px 18px 32px}
.settings-section-title{font-size:20px;font-weight:800;margin:4px 0 14px}
.activity-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}
.activity-stat{min-height:106px;border:1px solid #ededed;border-radius:22px;padding:18px 16px;background:#fff}
.activity-stat strong{display:block;font-size:28px;line-height:1.2;color:#6658e8;font-weight:850}
.activity-stat span{display:block;color:#666;font-size:15px;font-weight:650;margin-top:8px}
.activity-panel,.account-panel{border:1px solid #ededed;border-radius:22px;background:#fff;overflow:hidden;margin-bottom:24px}
.activity-empty{padding:22px 18px;color:#85858b;font-size:14px;line-height:1.5}
.account-field{padding:17px 16px;border-bottom:1px solid #eee}
.account-field:last-child{border-bottom:0}
.account-field small{display:block;color:#888;font-size:13px;font-weight:750;letter-spacing:.3px;text-transform:uppercase;margin-bottom:7px}
.account-field strong{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.language-overlay{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:300;display:none;align-items:flex-end}
.language-overlay.open{display:flex}
.language-sheet{width:100%;background:#fff;border-radius:26px 26px 0 0;padding:12px 18px calc(24px + env(safe-area-inset-bottom));color:#111}
.language-handle{width:54px;height:6px;border-radius:8px;background:#dedee1;margin:0 auto 24px}
.language-sheet h2{text-align:center;font-size:21px;margin:0 0 7px;font-weight:800}
.language-sheet>p{text-align:center;color:#929297;margin:0 0 22px;font-size:15px}
.language-options{background:#f7f8fa;border:1px solid #eee;border-radius:22px;padding:4px 16px}
.language-option{height:72px;width:100%;border:0;background:transparent;display:flex;align-items:center;gap:13px;text-align:left;color:#111;font-size:16px;font-weight:700}
.language-option+.language-option{border-top:1px solid #e4e5e8}
.language-option .flag{font-size:27px}
.language-option .radio{margin-left:auto;width:22px;height:22px;border:2px solid #c9c9cc;border-radius:50%;display:grid;place-items:center}
.language-option[aria-checked="true"] .radio{border-color:#0878f9}
.language-option[aria-checked="true"] .radio:after{content:"";width:10px;height:10px;border-radius:50%;background:#0878f9}



/* Correção final do cabeçalho Plus (+): igual à referência enviada */
#screen-criar .create-top{
  height:96px;
  grid-template-columns:48px minmax(0,1fr) 48px;
  padding:0 28px;
  gap:8px;
}
#screen-criar .create-tabs{
  width:100%;
  justify-content:space-evenly;
  gap:clamp(8px,3vw,24px);
}
#screen-criar .create-tools{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:72px;
  padding:0 4.4%;
}
#screen-criar .create-tool-actions{
  display:none!important;
}
#screen-criar .top-gallery-advance{
  display:inline-flex;
  flex:0 0 auto;
  align-items:center;
  justify-content:center;
  width:auto;
  min-width:0;
  height:auto;
  padding:8px 15px;
  border:1px solid #fff;
  border-radius:22px;
  background:transparent;
  color:#fff;
  font-size:15px;
  font-weight:750;
  white-space:nowrap;
  line-height:normal;
}
#screen-criar .create-bottom,
#screen-criar .profile-advance,
#screen-criar .advance-button{
  display:none!important;
}
@media(max-width:420px){
  #screen-criar .create-top{padding:0 20px;grid-template-columns:40px minmax(0,1fr) 40px}
  #screen-criar .create-tools{padding:0 24px;min-height:66px}
  #screen-criar .top-gallery-advance{width:auto;height:auto;padding:8px 15px;font-size:15px}
}
</style>
</head>
<body>
<main id="app">
  <section id="screen-home" class="screen active">
    <header class="app-header">
      <h1>koneat</h1>
      <div class="home-header-actions">
        <button class="icon-btn" aria-label="Buscar" onclick="toast('Busca em breve')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16.2 16.2 5 5"/></svg>
        </button>
        <button class="icon-btn" aria-label="Notificações" onclick="toast('Notificações em breve')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
        </button>
      </div>
    </header>
    <div class="home-tabs" role="tablist" aria-label="Feed">
      <button class="home-tab active" onclick="selectHomeTab(this)">pra você</button>
      <button class="home-tab" onclick="selectHomeTab(this)">seguindo</button>
      <button class="home-tab" onclick="selectHomeTab(this)">explorar</button>
    </div>
    <div class="stories" id="storiesBar"></div>
    <div id="homeFeed"></div>
  </section>

  <section id="screen-reels" class="screen">
    <header class="reels-header">
      <h2>Virais start</h2>

<script>
/* STORE ORIGINAL: mesmas chaves para preservar publicações e stories já salvos */
const KEY='koneat_posts_v2', KEY_STORIES='koneat_stories_v2';
const createStates={nav:{kind:'FEED',file:null},profile:{kind:'FEED',file:null}};
function createIds(origin){return origin==='profile'?{screen:'perfil-criar',empty:'createEmptyProfile',file:'criarFileProfile'}:{screen:'criar',empty:'createEmptyNav',file:'criarFileNav'}}
function getUser(){return localStorage.getItem('koneat_username')||'koneat_user'}
function getPosts(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function savePosts(p){localStorage.setItem(KEY,JSON.stringify(p))}
function getStories(){try{return JSON.parse(localStorage.getItem(KEY_STORIES)||'[]')}catch(e){return []}}
function saveStories(s){localStorage.setItem(KEY_STORIES,JSON.stringify(s))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}

/* SPA: alterna as telas sem recarregar a página */
function setNavAppearance(screen){
  const dark = screen==='criar' || screen==='reels';
  document.body.classList.toggle('nav-dark',dark);
  document.body.classList.toggle('nav-light',!dark);
  document.querySelectorAll('.bottom button').forEach(b=>{
    const active=b.dataset.go===screen;
    b.classList.toggle('active',active);
    b.toggleAttribute('aria-current',active);
    if(active)b.setAttribute('aria-current','page');
    const svg=b.querySelector('svg');
    const outline=svg.querySelectorAll('.outline'), filled=svg.querySelectorAll('.filled');
    outline.forEach(el=>el.style.display=active?'none':'');
    filled.forEach(el=>el.style.display=active?'':'none');
    if(b.dataset.go==='perfil'){
      outline.forEach(el=>el.style.display='');
      filled.forEach(el=>el.style.display='none');
    }
    const plus=svg.querySelector('.plus-mark'), play=svg.querySelector('.play-mark');
    if(plus)plus.setAttribute('stroke',active?'#111214':'currentColor');
    if(play){play.setAttribute('stroke',active?'#111214':'currentColor');play.setAttribute('fill',active?'#111214':'none')}
  });
}
function go(screen, origin){
  if(screen==='perfil-criar')screen='perfil-criar';
  document.body.classList.toggle('settings-open',screen==='config');
  closeProfileMenu();
  document.body.classList.toggle('profile-create-open',screen==='perfil-criar');
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const target=document.getElementById('screen-'+screen);if(!target)return;
  target.classList.add('active');
  setNavAppearance(screen==='perfil-criar'?'perfil':screen);
  if(screen==='home')renderHome();
  if(screen==='reels')renderReels();
  if(screen==='perfil')renderPerfil();
  if(screen==='criar')resetCreate('nav');
  if(screen==='perfil-criar')resetCreate('profile');
}
function closeCreate(origin){go(origin==='profile'?'perfil':'home')}
function toggleProfileMenu(event){event.stopPropagation();const menu=document.getElementById('profileMenu');const open=menu.classList.toggle('open');event.currentTarget.setAttribute('aria-expanded',String(open))}
function closeProfileMenu(){const menu=document.getElementById('profileMenu');if(menu)menu.classList.remove('open');const trigger=document.querySelector('[aria-label="Opções do perfil"]');if(trigger)trigger.setAttribute('aria-expanded','false')}
document.addEventListener('click',e=>{if(!e.target.closest('.profile-menu-wrap'))closeProfileMenu()});
function openSettings(title){closeProfileMenu();document.getElementById('settingsTitle').textContent=title||'Configurações';document.getElementById('settingsMain').hidden=false;document.getElementById('settingsSubpage').hidden=true;go('config')}
function closeSettings(){closeSettingsSubpage();go('perfil')}
function setSettingsTitle(title){document.getElementById('settingsTitle').textContent=title}
function closeSettingsSubpage(){const sub=document.getElementById('settingsSubpage');if(sub&&!sub.hidden){sub.hidden=true;document.getElementById('settingsMain').hidden=false;document.getElementById('settingsTitle').textContent='Configurações'}}
function settingsBack(){const sub=document.getElementById('settingsSubpage');if(sub&&!sub.hidden)closeSettingsSubpage();else closeSettings()}
function openSettingsPage(page){
  const main=document.getElementById('settingsMain'),sub=document.getElementById('settingsSubpage');
  main.hidden=true;sub.hidden=false;
  const user=localStorage.getItem('koneat_username')||'Não definido';
  const display=localStorage.getItem('koneat_display_name')||'Não informado';
  const privacy=localStorage.getItem('koneat_private_account');
  if(page==='activity'){
    const count=getPosts().filter(p=>p.author===getUser()).length;
    document.getElementById('settingsTitle').textContent='Minhas atividades';
    sub.innerHTML=`<h2 class="settings-section-title">Resumo da conta</h2><div class="activity-grid">
      <div class="activity-stat"><strong>${count}</strong><span>Publicações</span></div>
      <div class="activity-stat"><strong>—</strong><span>Total de interações</span></div>
      <div class="activity-stat"><strong>—</strong><span>Curtidas</span></div>
      <div class="activity-stat"><strong>—</strong><span>Comentários</span></div>
      <div class="activity-stat"><strong>—</strong><span>Reposts</span></div>
      <div class="activity-stat"><strong>—</strong><span>Marcações</span></div></div>
      <h2 class="settings-section-title">Segurança e comunidade</h2><div class="activity-panel"><div class="activity-empty">O gerenciamento de contas bloqueadas ainda não está disponível.</div></div>
      <h2 class="settings-section-title">Histórico de ações</h2><div class="activity-panel"><div class="activity-empty">O aplicativo ainda não registra um histórico de ações.</div></div>`;
  }else if(page==='account'){
    document.getElementById('settingsTitle').textContent='Informações da conta';
    const privacyText=privacy===null?'Não configurada':(privacy==='true'?'Privada':'Pública');
    sub.innerHTML=`<div class="account-panel">
      <div class="account-field"><small>Nome de usuário</small><strong>${escapeHTML(user)}</strong></div>
      <div class="account-field"><small>Nome da conta</small><strong>${escapeHTML(display)}</strong></div>
      <div class="account-field"><small>Privacidade da conta</small><strong>${privacyText}</strong></div>
      <div class="account-field"><small>Data de nascimento</small><strong>Não informada</strong></div>
      <div class="account-field"><small>Gênero</small><strong>Não informado</strong></div></div>`;
  }
}
function escapeHTML(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function openLanguageSheet(){const selected=localStorage.getItem('koneat_language')||'pt-BR';document.querySelectorAll('.language-option').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.lang===selected)));document.getElementById('languageOverlay').classList.add('open')}
function closeLanguageSheet(){document.getElementById('languageOverlay').classList.remove('open')}
function chooseLanguage(code){
  localStorage.setItem('koneat_language',code);
  document.querySelectorAll('.language-option').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.lang===code)));
  const labels={'pt-BR':'Português (Brasil)','en-GB':'English (UK)','es-ES':'Español (España)'};
  const row=[...document.querySelectorAll('.settings-row')].find(b=>b.querySelector('.settings-copy strong')?.textContent.trim()==='Idioma');
  if(row){let small=row.querySelector('small');if(!small){small=document.createElement('small');row.querySelector('.settings-copy').appendChild(small)}small.textContent=labels[code]}
  closeLanguageSheet();
}
function toggleSetting(row){
  const sw=row.querySelector('.settings-switch');if(!sw)return;sw.classList.toggle('on');
  const label=row.querySelector('.settings-copy strong')?.textContent||'';
  if(label.includes('Conta privada')){
    const value=sw.classList.contains('on');localStorage.setItem('koneat_private_account',String(value));
    const small=row.querySelector('.settings-copy small');if(small)small.textContent=value?'Privada':'Pública';
  }
  if(label.includes('Notificações')){
    const value=sw.classList.contains('on');localStorage.setItem('koneat_notifications',String(value));
    const small=row.querySelector('.settings-copy small');if(small)small.textContent=value?'Ativadas':'Desativadas';
  }
}
document.querySelectorAll('.bottom button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));

/* StoryCircle: o botão + continua dentro do círculo */
function renderStories(){
  const bar=document.getElementById('storiesBar');
  const stories=getStories().filter(s=>Date.now()<(s.expiresAt||0));
  const mine=stories.filter(s=>s.author===getUser()), others=stories.filter(s=>s.author!==getUser());
  const groups={};others.forEach(s=>{if(!groups[s.author])groups[s.author]=[];groups[s.author].push(s)});
  let html=`<button class="story" onclick="handleMeuStory()"><span style="position:relative;display:block;width:80px;height:80px">
    <span class="story-avatar ${mine.length?'has-story':''}">${mine.length?`<img src="${mine[0].midia}" alt="">`:``}</span>
    <span class="story-plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
    </span><span class="story-name">seu story</span></button>`;
  Object.keys(groups).forEach(author=>{const s=groups[author][0];html+=`<button class="story" onclick="openStory('${author}')"><span class="story-avatar"><img src="${s.midia}" alt=""></span><span class="story-name">${author}</span></button>`});
  bar.innerHTML=html;
}
function handleMeuStory(){
  const mine=getStories().filter(s=>s.author===getUser()&&Date.now()<s.expiresAt);
  if(mine.length){toast('Abrindo seu story...');openStory(getUser())}else document.getElementById('storyInput').click();
}
document.getElementById('storyInput').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{const arr=getStories();arr.unshift({id:Date.now(),author:getUser(),midia:reader.result,mediaType:file.type.startsWith('video')?'video':'image',expiresAt:Date.now()+86400000});saveStories(arr);e.target.value='';renderStories();toast('Story publicado!')};
  reader.readAsDataURL(file);
});
function openStory(author){toast('Story de @'+author)}

/* Componentes de publicação */
const heartSVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 8.8c0 5-8.8 11-8.8 11s-8.8-6-8.8-11A4.8 4.8 0 0 1 12 6.5a4.8 4.8 0 0 1 8.8 2.3Z"/></svg>';
const commentSVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2h9A3.5 3.5 0 0 1 20 5.5v8a3.5 3.5 0 0 1-3.5 3.5H10l-5 4v-4.8a3.5 3.5 0 0 1-1-2.7Z"/></svg>';
const saveSVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-6-4-6 4Z"/></svg>';
function postCard(p){
  const video=p.mediaType==='video';
  return `<article class="post"><div class="post-head"><b>@${p.author}</b><span style="font-size:12px;color:#888">${p.tipo}</span></div>
  <div class="post-media">${video?`<video src="${p.midia}" controls playsinline></video>`:`<img src="${p.midia}" alt="">`}</div>
  <div class="post-actions"><span><button aria-label="Curtir" onclick="likePost('${p.id}')">${heartSVG}</button><button aria-label="Comentar">${commentSVG}</button></span><button aria-label="Salvar">${saveSVG}</button></div>
  ${p.caption?`<div class="post-caption"><b>@${p.author}</b> ${p.caption}</div>`:''}</article>`;
}
function selectHomeTab(button){document.querySelectorAll('.home-tab').forEach(t=>t.classList.toggle('active',t===button));}
function renderHome(){
  renderStories();const feed=getPosts().filter(p=>p.tipo==='FEED');
  document.getElementById('homeFeed').innerHTML=feed.length?feed.map(postCard).join(''):'<div class="empty" style="padding-top:108px;font-size:16px">Nenhuma publicação no momento.<br>Crie um post para começar!</div>';
}
function renderReels(){
  const feed=getPosts().filter(p=>p.tipo==='VIRAL');
  document.getElementById('reelsFeed').innerHTML=feed.length?feed.map(postCard).join(''):'<div class="empty">Vídeos virais aparecerão aqui</div>';
}
let profileTab='all';
function selectProfileTab(button){
  profileTab=button.dataset.profileTab;
  document.querySelectorAll('.profile-tab').forEach(t=>t.classList.toggle('active',t===button));
  renderPerfil();
}
function renderPerfil(){
  const mine=getPosts().filter(p=>p.author===getUser());
  document.getElementById('perfilNome').textContent=getUser();
  document.getElementById('profilePostCount').textContent=mine.length;
  const grid=document.getElementById('perfilGrid'), empty=document.getElementById('profileEmpty');
  const showPosts=profileTab==='all'?mine:[];
  grid.innerHTML=showPosts.map(p=>p.mediaType==='video'?`<video src="${p.midia}" muted playsinline></video>`:`<img src="${p.midia}" alt="">`).join('');
  empty.style.display=showPosts.length?'none':'flex';
  if(profileTab!=='all')empty.querySelector('p').textContent=profileTab==='reposts'?'Seus reposts aparecerão aqui':'Publicações em que você foi marcado aparecerão aqui';
  else empty.querySelector('p').textContent='Crie seu primeiro post';
}
function likePost(){toast('Curtiu!')}

/* Duas experiências de criação independentes: Perfil e navegação Plus (+). */
function selectCreateTab(button,origin){
  const ids=createIds(origin), state=createStates[origin];
  document.querySelectorAll(`#screen-${ids.screen} .create-tab`).forEach(t=>t.classList.toggle('active',t===button));
  state.kind=button.dataset.kind;
  const labels={FEED:'Adicionar Imagem ou vídeo feed.',STORY:'Adicionar um Story.',VIRAL:'Adicionar um viral feed.'};
  const empty=document.getElementById(ids.empty);
  empty.innerHTML=`<div class="koneat-mark" aria-label="Koneat">K<span>.</span></div><p>${labels[state.kind]}</p>`;
  document.getElementById(ids.file).setAttribute('accept',state.kind==='VIRAL'?'video/*':'image/*,video/*');
}
function resetCreate(origin){
  const ids=createIds(origin),state=createStates[origin];
  state.file=null;state.kind='FEED';
  document.getElementById(ids.file).value='';
  const screen=document.getElementById(`screen-${ids.screen}`);
  screen.querySelectorAll('.create-tab').forEach(t=>t.classList.toggle('active',t.dataset.kind==='FEED'));
  document.getElementById(ids.empty).innerHTML='<div class="koneat-mark" aria-label="Koneat">K<span>.</span></div><p>Adicionar Imagem ou vídeo feed.</p>';
  document.getElementById(ids.file).setAttribute('accept','image/*,video/*');
}
function advanceCreate(origin){
  const ids=createIds(origin),state=createStates[origin],file=state.file;
  if(!file){document.getElementById(ids.file).click();return}
  if(file.type.startsWith('video')&&file.size>50*1024*1024){toast('O vídeo deve ter no máximo 50 MB');return}
  const reader=new FileReader();
  reader.onload=()=>{
    if(state.kind==='STORY'){
      const stories=getStories();stories.unshift({id:Date.now(),author:getUser(),midia:reader.result,mediaType:file.type.startsWith('video')?'video':'image',expiresAt:Date.now()+86400000});saveStories(stories);toast('Story publicado!');go('home');return;
    }
    const posts=getPosts();posts.unshift({id:'post_'+Date.now(),author:getUser(),midia:reader.result,mediaType:file.type.startsWith('video')?'video':'image',tipo:state.kind==='VIRAL'?'VIRAL':'FEED',caption:'',createdAt:Date.now()});savePosts(posts);
    toast('Publicado!');go(state.kind==='VIRAL'?'reels':'perfil');
  };
  reader.readAsDataURL(file);
}
['nav','profile'].forEach(origin=>{
  const ids=createIds(origin);
  document.getElementById(ids.file).addEventListener('change',e=>{
    const state=createStates[origin];state.file=e.target.files[0]||null;if(!state.file)return;
    if(state.file.type.startsWith('video')&&state.file.size>50*1024*1024){toast('O vídeo deve ter no máximo 50 MB');e.target.value='';state.file=null;return}
    const preview=document.getElementById(ids.empty),url=URL.createObjectURL(state.file);
    preview.innerHTML=state.file.type.startsWith('video')?`<video src="${url}" controls playsinline style="max-width:85%;max-height:38vh"></video><p>Vídeo selecionado</p>`:`<img src="${url}" alt="Prévia da publicação" style="max-width:85%;max-height:38vh;object-fit:contain"><p>Foto selecionada</p>`;
  });
});

function render(){renderHome();setNavAppearance('home')}
render();
</script>
